bundle:
  name: clawhouse

sync:
  exclude:
    - .venv/
    - .git/
    - .agents/
    - .github/
    - .pytest_cache/
    - .ruff_cache/
    - .complexipy_cache/
    - logs/
    - tests/
    - docs/
    - frontend/
    # Static assets are committed; without these the Apps builder runs `npm run build` and fails.
    - package.json
    - package-lock.json
    - vitest.config.ts
    - playwright.config.ts
    - e2e/
    - Makefile
    - "**/__pycache__/"
    - "**/*.pyc"
    # Root guide only. claw/agents/main/AGENTS.md is the platform agent file and must sync.
    - /AGENTS.md
    - README.md
    - pyproject.toml
    - uv.lock
    - skills-lock.json
    - .pre-commit-config.yaml
    - .gitignore
    - .python-version
    - databricks.yml

variables:
  serving_endpoint:
    description: Model Serving endpoint used as the default chat model.
    default: databricks-meta-llama-3-3-70b-instruct
  postgres_branch:
    description: Lakebase Autoscaling branch that stores sessions and transcripts.
    default: projects/clawhouse/branches/production
  postgres_database:
    description: Lakebase database that stores sessions and transcripts.
    default: projects/clawhouse/branches/production/databases/databricks-postgres
  provider_secret_scope:
    description: Secret scope holding the extra-provider API key.
    default: claw
  provider_secret_key:
    description: Secret key holding the extra-provider API key.
    default: openrouter-api-key
  sql_warehouse_id:
    description: Databricks SQL Warehouse ID for SQL queries and SQL job tasks.
    default: "95a46431cf830347"

resources:
  apps:
    clawhouse:
      name: clawhouse
      description: Databricks-native agent chat surface with a model picker.
      source_code_path: .
      user_api_scopes:
        - model-serving
        - sql
        - ai-functions
        - genie
        - workspace.workspace
        - mcp.external
        - ai-gateway
      config:
        command:
          - uvicorn
          - clawhouse.api.app:app
        env:
          - name: PYTHONPATH
            value: src
          - name: SERVING_ENDPOINT
            value_from: serving-endpoint
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: OPENROUTER_API_KEY
            value_from: openrouter-api-key
          - name: CLAWHOUSE_MODELS
            value: '[{"id":"openai-gpt-6-luna","label":"GPT-6 Luna (OpenRouter)","model":"openai/gpt-6-luna","base_url":"https://openrouter.ai/api/v1","api_key_env":"OPENROUTER_API_KEY","default":true}]'
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: CLAWHOUSE_MLFLOW_TRACING
            value: "true"
          - name: MLFLOW_EXPERIMENT_NAME
            value: "/Users/matheus.buniotto@gmail.com/clawhouse-traces"
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: openrouter-api-key
          secret:
            scope: ${var.provider_secret_scope}
            key: ${var.provider_secret_key}
            permission: READ
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

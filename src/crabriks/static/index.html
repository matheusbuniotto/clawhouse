<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crabriks</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <p class="mark">Crabriks</p>
        <p id="who" class="who">Checking sign-in…</p>
      </header>
      <nav class="nav">
        <a href="/chat">Chat</a>
        <a href="/sessions">Sessions</a>
        <a href="/new">New session</a>
        <a href="/approvals">Approvals</a>
        <a href="/status">Status</a>
      </nav>
      <main id="log" class="log" aria-live="polite"></main>
      <form id="composer" class="composer">
        <div class="model-row">
          <label class="sr" for="model">Model</label>
          <select id="model" class="model"></select>
        </div>
        <label class="sr" for="message">Message</label>
        <textarea id="message" rows="1" placeholder="Message the agent" required></textarea>
        <button type="submit">Send</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </div>
    <script type="module" src="/chat.js"></script>
  </body>
</html>

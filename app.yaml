# Uvicorn reads UVICORN_HOST and UVICORN_PORT, which the Apps runtime sets.
# Add a serving endpoint (key serving-endpoint) and a Lakebase Autoscaling
# database (key postgres) in the app UI. The platform injects PGHOST, PGPORT,
# PGUSER, PGDATABASE, and PGSSLMODE. Do not set CLAWHOUSE_DEV_USER or
# DATABRICKS_TOKEN here. Create the app with user-authorization scope
# `model-serving`, or the forwarded user token cannot call the endpoint.
command:
  - uvicorn
  - clawhouse.api.app:app
env:
  - name: PYTHONPATH
    value: src
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # Optional extra OpenAI-compatible models (OpenRouter, etc.). Add a secret
  # resource with key `openrouter-api-key` in the app UI, then uncomment:
  # - name: OPENROUTER_API_KEY
  #   valueFrom: openrouter-api-key
  # - name: CLAWHOUSE_MODELS
  #   value: '[{"id":"openrouter-model","label":"My model (OpenRouter)","model":"<provider>/<model>","base_url":"https://openrouter.ai/api/v1","api_key_env":"OPENROUTER_API_KEY","default":true}]'
  - name: CLAWHOUSE_MLFLOW_TRACING
    value: "true"
  # Traces go to a shared workspace experiment; point this at any experiment
  # path the app's service principal can write to.
  - name: MLFLOW_EXPERIMENT_NAME
    value: "/Shared/clawhouse-traces"
